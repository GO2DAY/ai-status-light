<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Status Light (fallback)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111827;
      font-family: 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      color: #e5e7eb;
      padding: 12px;
    }
    h1 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: #9ca3af; }
    #strip { display: flex; flex-wrap: wrap; gap: 4px; }
    .light {
      display: flex; flex-direction: column; align-items: center;
      width: 56px; padding: 8px 0; border-radius: 8px; cursor: default;
      position: relative;
    }
    .light:hover { background: rgba(255,255,255,0.06); }
    .dot { width: 16px; height: 16px; border-radius: 50%; }
    .name { margin-top: 4px; font-size: 10px; color: #d1d5db; max-width: 52px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .running { background: #22c55e; box-shadow: 0 0 8px 2px rgba(34,197,94,.55); }
    .idle { background: #facc15; box-shadow: 0 0 8px 2px rgba(250,204,21,.45); }
    .stuck { background: #ef4444; box-shadow: 0 0 10px 3px rgba(239,68,68,.6); animation: blink 1s ease-in-out infinite; }
    .assist { background: #a855f7; box-shadow: 0 0 12px 4px rgba(168,85,247,.75); animation: blink 0.8s ease-in-out infinite; }
    .offline { background: #6b7280; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
    .light .tip {
      display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      margin-top: 6px; width: 220px; background: rgba(17,24,39,.97); border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; padding: 10px; font-size: 11px; line-height: 1.5; color: #d1d5db;
      z-index: 10; box-shadow: 0 10px 25px rgba(0,0,0,.5);
    }
    .light:hover .tip { display: block; }
    .tip b { color: #f3f4f6; }
    .tip .muted { color: #6b7280; font-size: 10px; }
    #hint { margin-top: 14px; font-size: 11px; color: #6b7280; line-height: 1.6; }
    code { background: rgba(255,255,255,.08); padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>AI Status Light — fallback 页面（浏览器版，无置顶/无边框）</h1>
  <div id="strip"></div>
  <div id="hint">
    上报状态：<code>POST /status {"agent":"kimi","status":"running|idle|stuck|assist|offline","task":"..."}</code><br />
    每 2 秒自动刷新。灰=离线，绿=运行中，黄=空闲/等待，红闪=卡住需人工介入。
  </div>

  <script>
    const STATUS_LABEL = { running: '运行中', idle: '空闲/等待', stuck: '卡住/需人工介入', assist: '求助·已电话通知，待人工处理', offline: '离线' };

    function relTime(ts) {
      if (!ts) return '从未上报';
      const d = Date.now() - ts;
      if (d < 5000) return '刚刚';
      if (d < 60000) return Math.floor(d / 1000) + ' 秒前';
      if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
      return Math.floor(d / 3600000) + ' 小时前';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    async function refresh() {
      try {
        const res = await fetch('/api/state');
        const body = await res.json();
        const strip = document.getElementById('strip');
        strip.innerHTML = '';
        for (const a of body.agents || []) {
          const el = document.createElement('div');
          el.className = 'light';
          el.innerHTML =
            '<span class="dot ' + a.status + '"></span>' +
            '<span class="name">' + escapeHtml(Array.from(a.name || a.id).slice(0, 2).join('')) + '</span>' +
            '<div class="tip"><b>' + escapeHtml(a.name) + '</b> <span class="muted">' + escapeHtml(a.id) + '</span><br />' +
            '状态：' + (STATUS_LABEL[a.status] || a.status) + (a.auto ? '（心跳超时自动降级）' : '') + '<br />' +
            (a.task ? '任务：' + escapeHtml(a.task) + '<br />' : '') +
            '<span class="muted">最后心跳：' + relTime(a.lastHeartbeat) + '</span></div>';
          strip.appendChild(el);
        }
      } catch (err) {
        console.error('refresh failed:', err);
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
